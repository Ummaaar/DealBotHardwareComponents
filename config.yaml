# =============================================================================
# DealBot — configuration
# =============================================================================
# Les motifs (include / require / exclude) sont des expressions régulières
# appliquées au TITRE du deal, une fois normalisé :
#   - tout en minuscules, sans accents ("écran" -> "ecran", "carte mère" -> "carte mere")
#   - tirets et underscores remplacés par des espaces ("RX-9070" -> "rx 9070")
#
#   include : au moins UN motif doit correspondre
#   require : TOUS les motifs doivent correspondre (ex : modèle + capacité)
#   exclude : si UN motif correspond, le deal est ignoré
#   max_price / min_price : fourchette de prix en € (min_price filtre les accessoires)
#
# Astuces regex : " ?" = espace optionnel, "\b" = limite de mot, "a|b" = a OU b.
# Les plafonds sont des "bons prix" en contexte de pénurie mémoire (fin 2026) :
# ajuste-les selon le marché.
# =============================================================================

settings:
  webhook_env: DISCORD_WEBHOOK_URL   # nom de la variable / du secret contenant l'URL du webhook
  username: DealBot
  avatar_url: ""                     # optionnel : URL d'une image pour l'avatar du bot
  mention: ""                        # "@here" ou "@everyone" pour une notif forte, "" pour rien
  notify_on_first_run: false         # false = le 1er lancement mémorise l'existant sans spammer

feeds:
  - url: https://www.dealabs.com/rss/new     # tous les nouveaux deals
  - url: https://www.dealabs.com/rss/hot     # deals devenus "hot" (sert aux pépites)
    hot: true

# Ignoré partout : PC complets, portables, consoles (ils contiennent des noms de composants)
global_exclude:
  - '\bpc (portable|gamer|gaming|fixe|de bureau|complet)\b'
  - '\b(ordinateur|laptop|notebook|ultrabook|macbook|chromebook)\b'
  - '\bconfig(uration)? (gamer|gaming|complete|pc)\b'
  - '\b(ps5|playstation|xbox|nintendo|steam deck|rog ally|legion go)\b'
  - '\b(smartphone|iphone|ipad|tablette|televiseur|tv)\b'

# Pépites : n'importe quel deal informatique qui devient "hot" sur Dealabs,
# même s'il ne correspond à aucune cible (te fait découvrir les vraies affaires).
pepites:
  enabled: true
  min_temperature: 0       # ex: 300 pour ne garder que les deals très bien notés
  include:
    - '\b(carte graphique|gpu|geforce|radeon|rtx|rx ?\d{4})\b'
    - '\b(processeur|cpu|ryzen|core i[3579]|core ultra)\b'
    - '\b(ram|ddr4|ddr5|barrette)\b'
    - '\b(ssd|nvme|m\.2|disque dur|hdd|nas)\b'
    - '\b(carte mere|alimentation|ventirad|watercooling|aio|boitier pc)\b'
    - '\b(ecran|moniteur|clavier|souris|webcam|micro usb|casque gaming)\b'
    - '\b(switch (reseau|ethernet|manageable)|routeur|point d.acces|wifi ?7|mini pc|raspberry)\b'
  exclude:
    - '\b(coque|housse|film protection|protection ecran)\b'

# -----------------------------------------------------------------------------
# Cibles : composants et prix plafonds
# -----------------------------------------------------------------------------
