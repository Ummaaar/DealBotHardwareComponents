name: DealBot

on:
  schedule:
    - cron: "*/15 * * * *"   # toutes les 15 min (UTC) — GitHub peut décaler de quelques minutes
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main

concurrency:
  group: dealbot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Récupère l'état anti-doublon du run précédent
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: dealbot-state-${{ github.run_id }}
          restore-keys: dealbot-state-

      - name: Vérifier les deals
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot.py

      # Sauvegarde l'état pour le prochain run (même si une étape a échoué)
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: dealbot-state-${{ github.run_id }}
