name: DealBot

on:
  schedule:
    - cron: "*/15 * * * *"   # secours : la planification GitHub n'est pas garantie
  workflow_dispatch:          # déclencheur principal : cron-job.org (voir README) ou bouton "Run workflow"

concurrency:
  group: dealbot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # pour le keepalive ci-dessous

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Récupère l'état anti-doublon du run précédent
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: dealbot-state-${{ github.run_id }}
          restore-keys: dealbot-state-

      - name: Vérifier les deals
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot.py

      # GitHub met en pause les workflows planifiés après 60 jours sans activité
      # sur le dépôt : réactiver le workflow via l'API remet ce compteur à zéro.
      # (s'exécute à chaque run, y compris ceux déclenchés par cron-job.org)
      - name: Keepalive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/dealbot.yml/enable" --silent

      # Sauvegarde l'état pour le prochain run (même si une étape a échoué)
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: dealbot-state-${{ github.run_id }}
